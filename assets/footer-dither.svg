<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" role="img" aria-label="dithered divider">
<defs><clipPath id="c"><rect width="1200" height="120" rx="16"/></clipPath><style>
.f1{animation:a 1.6s steps(1) infinite}.f2{animation:b 1.6s steps(1) infinite}
@keyframes a{0%{opacity:1}50%{opacity:0}}@keyframes b{0%{opacity:0}50%{opacity:1}}
.name{font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
.role{font:400 16px 'Courier New',Courier,monospace;fill:#cfcfcf}
.mut{font:400 14px 'Courier New',Courier,monospace;fill:#8a8a8a}
.hot{font:700 14px 'Courier New',Courier,monospace;fill:#fff}
.cur{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.cur{animation:none}.f2{opacity:0}}
</style></defs>
<g clip-path="url(#c)">
<rect width="1200" height="120" fill="#050505"/>
<image class="f1" href="data:image/png;base64," width="1200" height="120" style="image-rendering:pixelated"/>
<image class="f2" href="data:image/png;base64," width="1200" height="120" style="image-rendering:pixelated"/>
<text class="mut" x="600" y="104" text-anchor="middle">~ what will you build next? ~</text>
</g></svg>