<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="Methuli Heenkenda, AI and ML, dithered glowing orb">
<defs><clipPath id="c"><rect width="1200" height="360" rx="16"/></clipPath><style>
.f1{animation:a 1.6s steps(1) infinite}.f2{animation:b 1.6s steps(1) infinite}
@keyframes a{0%{opacity:1}50%{opacity:0}}@keyframes b{0%{opacity:0}50%{opacity:1}}
.name{font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
.role{font:400 16px 'Courier New',Courier,monospace;fill:#cfcfcf}
.mut{font:400 14px 'Courier New',Courier,monospace;fill:#8a8a8a}
.hot{font:700 14px 'Courier New',Courier,monospace;fill:#fff}
.cur{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.cur{animation:none}.f2{opacity:0}}
</style></defs>
<g clip-path="url(#c)">
<rect width="1200" height="360" fill="#050505"/>
<image class="f1" href="data:image/png;base64," width="1200" height="360" style="image-rendering:pixelated"/>
<image class="f2" href="data:image/png;base64," width="1200" height="360" style="image-rendering:pixelated"/>

<rect x="40" y="62" width="420" height="236" rx="22" fill="#141414" fill-opacity=".92"/>
<text class="name" x="72" y="122">Methuli</text>
<text class="name" x="72" y="168">Heenkenda</text>
<text class="role" x="74" y="204">AI &amp; ML · agentic systems · full-stack</text>
<text class="mut" x="74" y="232">Colombo, Sri Lanka · IIT × RGU</text>
<text class="hot" x="74" y="268">&gt; open to internships<tspan class="cur">_</tspan></text>
<rect x="405" y="82" width="14" height="14" fill="#fff"/><rect x="419" y="96" width="14" height="14" fill="#fff"/>

</g></svg>